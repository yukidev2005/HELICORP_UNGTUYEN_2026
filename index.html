<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PMO Wave75 | Premium Custom Mechanical Keyboard</title>
    <meta
      name="description"
      content="Experience the ultimate custom keyboard experience with PMO Wave75 - CNC Aluminum, Hot-swappable, and Stunning RGB."
    />

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload LCP hero image to boost Largest Contentful Paint score -->
    <link
      rel="preload"
      as="image"
      href="/images/ban-phim-co-wave75-4.webp"
      fetchpriority="high"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="PMO Wave75 | Premium Custom Mechanical Keyboard"
    />
    <meta property="og:image" content="/images/ban-phim-co-wave75-4.webp" />
    <meta
      property="og:description"
      content="Experience the ultimate custom keyboard with PMO Wave75 - CNC Aluminum, Hot-swappable, RGB."
    />

    <!-- Theme color for browser chrome -->
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
  </head>
